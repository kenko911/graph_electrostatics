[metadata]
name = graph_longrange
version = attr: graph_longrange.__version__
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3.8

[options]
packages = find:
python_requires = >=3.8
# e3nn is used in exactly two places -- o3.SphericalHarmonics / o3.spherical_harmonics in
# gto_utils.py and realspace_grid_integrals.py, plus the Irreps helpers.  Those signatures,
# and the default 'integral' normalization the unqualified call sites rely on, are unchanged
# from 0.4.4 through 0.6.0, and the test suite gives identical results on every release in
# that range, so the pin does not need to be exact.
install_requires =
    torch>=1.8
    e3nn>=0.4.4
    numpy
    scipy
    ase
